# nginx site: /etc/nginx/sites-available/fedai-web  (then ln -s into sites-enabled)
# The app listens on 127.0.0.1:8787 only; nginx is the only public entry point.
server {
    listen 80;
    server_name _;                      # replace with the domain when there is one
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name _;                      # replace with the domain
    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;   # from certbot
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;

    # Until the paper is out the site is for the team only: one shared login (htpasswd -c /etc/nginx/fedai.htpasswd team).
    auth_basic "FedAI";
    auth_basic_user_file /etc/nginx/fedai.htpasswd;

    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy same-origin;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
